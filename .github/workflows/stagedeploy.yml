name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - staging

permissions:
  id-token: write   # required for OIDC auth to AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Hashed assets can be cached hard; HTML must always revalidate so a
      # deploy is visible immediately even before the invalidation lands.
      - name: Sync immutable assets
        run: |
          aws s3 sync ./dist s3://stage.usedrydock.com-812245815595-ap-south-1-an \
            --delete \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync HTML and feeds
        run: |
          aws s3 sync ./dist s3://stage.usedrydock.com-812245815595-ap-south-1-an \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.txt" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_STAGE }} \
            --paths "/*"
